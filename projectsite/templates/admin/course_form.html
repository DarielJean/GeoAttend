
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Course - GeoAttend</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        .header {
            background: #194d29;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .brand span {
            font-size: 14px;
            margin-left: 8px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #194d29;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #194d29;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #194d29;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #194d29;
            color: white;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="brand">
            GeoAttend
            <span>PSU</span>
        </div>

        <div>
            Administrator
        </div>
    </div>

    <div class="container">

        <div class="form-box">

            <h1>Add Course</h1>

            <p class="subtitle">
                Create a new course and assign it to a department and attendance holder.
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label for="code">Course Code</label>

                    <input
                        type="text"
                        id="code"
                        name="code"
                        placeholder="e.g. CS101"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="name">Course Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Introduction to Programming"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" name="department" required>
                        <option value="">Select Department</option>

                        {% for department in departments %}
                            <option value="{{ department.id }}">
                                {{ department.code }} - {{ department.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="teacher">Attendance Holder</label>

                    <select id="teacher" name="teacher" required>
                        <option value="">Select Attendance Holder</option>

                        {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">
                                {{ teacher.first_name }} {{ teacher.last_name }}
                                ({{ teacher.username }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="buttons">

                    <button type="submit" class="btn btn-primary">
                        Add Course
                    </button>

                    <a
                        href="{% url 'admin-dashboard' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
