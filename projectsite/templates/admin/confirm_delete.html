<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete {{ item_label }} - GeoAttend</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        .header {
            background: #194d29;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .brand span {
            font-size: 14px;
            margin-left: 8px;
        }

        .container {
            width: 90%;
            max-width: 560px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #194d29;
        }

        .subtitle {
            color: #444;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-danger {
            background: #b91c1c;
            color: white;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            GeoAttend
            <span>PSU</span>
        </div>

        <div>
            Administrator
        </div>
    </div>

    <div class="container">
        <div class="form-box">
            <h1>Delete {{ item_label }}</h1>
            <p class="subtitle">
                Are you sure you want to delete <strong>{{ obj }}</strong>? This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="buttons">
                    <button type="submit" class="btn btn-danger">
                        Yes, Delete
                    </button>
                    <a
                        href="/admin-dashboard/?section={{ cancel_section }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
