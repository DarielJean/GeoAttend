
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - GeoAttend</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f5;
            color: #111827;
        }

        /* HEADER */
        .navbar {
            height: 74px;
            background: #123f22;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7.3%;
            color: white;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 37px;
            height: 37px;
            border-radius: 10px;
            background: #355d42;
            border: 1px solid #69806f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .brand-name {
            font-size: 26px;
            font-weight: bold;
        }

        .psu {
            background: #52705b;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 14px;
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .student-checkin {
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .faculty-button {
            background: white;
            color: #173f25;
            text-decoration: none;
            padding: 9px 21px;
            border-radius: 22px;
            font-size: 16px;
            font-weight: bold;
        }

        /* MAIN */
        .main {
            min-height: calc(100vh - 74px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 66px;
            padding-bottom: 50px;
        }

        /* CARD */
        .card {
            width: 600px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .card-header {
            background: #145529;
            color: white;
            text-align: center;
            padding: 26px 20px;
        }

        .card-header h1 {
            margin: 0;
            font-size: 29px;
            font-weight: bold;
        }

        .card-body {
            padding: 30px 35px 32px;
        }

        .form-row {
            display: flex;
            gap: 18px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 17px;
            margin-bottom: 8px;
            font-weight: normal;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #cfd5dc;
            border-radius: 8px;
            background: #eef4ff;
            font-size: 16px;
            color: #111827;
        }

        input:focus {
            outline: none;
            border: 2px solid #173f25;
            background: white;
        }

        input::placeholder {
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 7px;
            padding: 11px 13px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .register-button {
            width: 100%;
            height: 53px;
            margin-top: 4px;
            border: none;
            border-radius: 8px;
            background: #145529;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #0e421f;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 17px;
        }

        .login-link a {
            color: #145529;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .navbar {
                padding: 0 20px;
            }

            .brand-name {
                font-size: 21px;
            }

            .student-checkin {
                display: none;
            }

            .faculty-button {
                font-size: 14px;
                padding: 8px 14px;
            }

            .main {
                padding: 30px 15px;
            }

            .card {
                width: 100%;
            }

            .card-body {
                padding: 25px 22px;
            }

            .form-row {
                display: block;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <div class="brand">
            <div class="brand-icon">G</div>
            <div class="brand-name">GeoAttend</div>
            <div class="psu">PSU</div>
        </div>

        <div class="nav-links">

            <a href="{% url 'student-checkin' %}" class="student-checkin">
                Student Check-In
            </a>

            <a href="/admin/login/" class="faculty-button">
                Faculty Sign In
            </a>

        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <div class="card">

            <div class="card-header">
                <h1>STUDENT REGISTRATION</h1>
            </div>

            <div class="card-body">

                {% if error %}
                    <div class="error">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <!-- STUDENT ID -->
                    <div class="form-group">
                        <label for="student_id">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="student_id"
                            name="student_id"
                            placeholder="Enter your student ID"
                            value="{{ request.POST.student_id }}"
                            required
                        >
                    </div>


                    <!-- FIRST AND LAST NAME -->
                    <div class="form-row">

                        <div class="form-group">
                            <label for="firstname">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="firstname"
                                name="firstname"
                                placeholder="Enter first name"
                                value="{{ request.POST.firstname }}"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="lastname">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="lastname"
                                name="lastname"
                                placeholder="Enter last name"
                                value="{{ request.POST.lastname }}"
                                required
                            >
                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            value="{{ request.POST.email }}"
                            required
                        >
                    </div>


                    <!-- PASSWORD -->
                    <div class="form-row">

                        <div class="form-group">
                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="confirm_password">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Confirm password"
                                required
                            >
                        </div>

                    </div>


                    <!-- REGISTER -->
                    <button
                        type="submit"
                        class="register-button"
                    >
                        Register Student
                    </button>

                </form>


                <!-- LOGIN LINK -->
                <div class="login-link">
                    Already have an account?

                    <a href="{% url 'student-login' %}">
                        Student Sign In
                    </a>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
