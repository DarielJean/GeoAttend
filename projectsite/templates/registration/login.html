
{% extends 'base.html' %}
{% block title %}Teacher Sign In | GeoAttend{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-primary text-white text-center py-3">
                <h5 class="mb-0 fw-bold">
                    GeoAttend Teacher Sign In
                </h5>
            </div>

            <div class="card-body p-4">

                {% if form.errors %}
                    <div class="alert alert-danger small">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            autofocus
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >

                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2 fw-semibold"
                    >
                        Teacher Sign In
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
